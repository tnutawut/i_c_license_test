<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insurance Calculator - Mobile App</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400&family=Kanit:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', 'Kanit', sans-serif;
            font-weight: 400 !important;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 24px 20px 40px 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Logo Area */
        .logo-box {
            width: 140px;
            height: 120px;
            margin-bottom: 24px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* User Info Section */
        .user-info-section {
            width: 100%;
            margin-bottom: 20px;
        }

        .row-single {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .row-single label {
            color: #000;
            width: 50px;
        }

        .row-triple {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 20px;
        }

        .inline-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .inline-group label {
            color: #000;
            white-space: nowrap;
        }

        .input-gray {
            background-color: #d1d5db;
            border: none;
            outline: none;
            padding: 6px 10px;
            color: #111827;
            border-radius: 2px;
            width: 100%;
            text-align: center;
        }

        select.input-gray {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            text-align-last: center;
        }

        .w-d1 { width: 100%; text-align: left; }
        .w-d2 { width: 55px; }
        .w-d3 { width: 60px; }
        .w-d4 { width: 60px; }

        .section-banner {
            width: 100%;
            background-color: #d9ebd0;
            color: #000;
            padding: 6px 10px;
            margin-bottom: 10px;
            text-align: left;
            border-radius: 2px;
        }

        .grid-dual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin-bottom: 12px;
        }

        .grid-dual select, .grid-dual input {
            height: 38px;
            padding: 0 8px;
        }

        .row-sum-main {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .row-sum-main label {
            color: #000;
            white-space: nowrap;
            padding-left: 15px;
        }

        .w-d7 {
            width: 110px;
            height: 38px;
            text-align: center;
        }

        .riders-container {
            width: 100%;
            margin-bottom: 8px;
        }

        .rider-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-d16 {
            width: 55px;
            height: 38px;
            background-color: #d1d5db;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 16px;
            align-self: flex-start;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .btn-d16 img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .total-section {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 28px;
        }

        .total-section label {
            color: #000;
        }

        .total-box-gray {
            width: 130px;
            height: 38px;
            background-color: #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111827;
            border-radius: 2px;
        }

        .calculating-text {
            color: #9ca3af !important;
        }

        .btn-create-schedule {
            width: 80%;
            max-width: 280px;
            height: 44px;
            background-color: #38761d;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            margin-bottom: 24px;
        }

        .footer-text {
            color: #111827;
            text-align: center;
        }

        .loader {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #d1d5db;
            border-top: 4px solid #38761d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <div class="logo-box">
            <img src="MTlogo.png" alt="Logo" onerror="this.onerror=null; this.parentNode.innerText='logo';">
        </div>

        <div class="user-info-section">
            <div class="row-single">
                <label>ชื่อ</label>
                <input type="text" id="inputD1" class="input-gray w-d1" value="คุณลูกค้า กรุงเทพประกันชีวิต">
            </div>

            <div class="row-triple">
                <div class="inline-group">
                    <label>อายุ</label>
                    <input type="text" id="inputD2" class="input-gray w-d2" value="-" onfocus="if(this.value==='-')this.value='';" onblur="if(this.value==='')this.value='-'; triggerCalculateAll();" oninput="triggerCalculateAll()">
                </div>

                <div class="inline-group">
                    <label>ชั้นอาชีพ</label>
                    <select id="inputD3" class="input-gray w-d3" onchange="triggerCalculateAll()">
                        <option value="-">-</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>

                <div class="inline-group">
                    <label>เพศ</label>
                    <select id="inputD4" class="input-gray w-d4" onchange="triggerCalculateAll()">
                        <option value="-">-</option>
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- เลือกสัญญาหลัก -->
        <div class="section-banner">เลือกสัญญาหลัก</div>
        
        <div class="grid-dual">
            <select id="selectMainPlan" class="input-gray" onchange="triggerCalculateD6()">
                <option value="">เลือกแบบประกัน</option>
            </select>
            <input type="text" id="inputD6" class="input-gray" value="-" placeholder="D6" readonly>
        </div>

        <div class="row-sum-main">
            <label>ทุนประกัน</label>
            <input type="text" id="inputD7" class="input-gray w-d7" value="-" 
                   onfocus="if(this.value==='-')this.value='';" 
                   onblur="formatD7OnBlur(); triggerCalculateD6();" 
                   oninput="formatD7OnInput(); triggerCalculateD6();">
        </div>

        <!-- เลือกสัญญาเพิ่มเติม -->
        <div class="section-banner">เลือกสัญญาเพิ่มเติม</div>
        
        <div class="riders-container" id="ridersList">
            <div class="rider-row">
                <select class="input-gray rider-select" onchange="triggerCalculateRiders()">
                    <option value="">เลือกสัญญาเพิ่มเติม</option>
                </select>
                <input type="text" class="input-gray rider-premium" value="-" placeholder="D9" readonly>
            </div>
            <div class="rider-row">
                <select class="input-gray rider-select" onchange="triggerCalculateRiders()">
                    <option value="">เลือกสัญญาเพิ่มเติม</option>
                </select>
                <input type="text" class="input-gray rider-premium" value="-" placeholder="D11" readonly>
            </div>
            <div class="rider-row">
                <select class="input-gray rider-select" onchange="triggerCalculateRiders()">
                    <option value="">เลือกสัญญาเพิ่มเติม</option>
                </select>
                <input type="text" class="input-gray rider-premium" value="-" placeholder="D13" readonly>
            </div>
            <div class="rider-row">
                <select class="input-gray rider-select" onchange="triggerCalculateRiders()">
                    <option value="">เลือกสัญญาเพิ่มเติม</option>
                </select>
                <input type="text" class="input-gray rider-premium" value="-" placeholder="D15" readonly>
            </div>
        </div>

        <button class="btn-d16" type="button" onclick="addRiderRow()">
            <img src="plus_v1.png" alt="D16" onerror="this.onerror=null; this.parentNode.innerText='+';">
        </button>

        <div class="total-section">
            <label>เบี้ยประกันรวม</label>
            <div class="total-box-gray" id="totalD17">-</div>
        </div>

        <button class="btn-create-schedule" type="button" onclick="createPaymentSchedule()">Create payment schedule</button>

        <div class="footer-text">Created by Nutawut Tamapon</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwANryoyhwHQwIIkq6fsdu8VPn4CIzIBKeOHn0hCObEtWZDHT7Yw2RV0KPxsRtblCxblQ/exec";

        let insuranceList = [];
        let debounceTimerD6 = null;
        let debounceTimerRiders = null;

        function showLoader() { document.getElementById('loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        function getValue(item, keys) {
            if (!item) return '';
            for (let k of keys) {
                if (item[k] !== undefined && item[k] !== null) {
                    const val = String(item[k]).trim();
                    if (val !== '') return val;
                }
            }
            return '';
        }

        function formatD7OnInput() {
            const input = document.getElementById('inputD7');
            let rawVal = input.value.replace(/,/g, '');
            if (rawVal === '' || rawVal === '-') return;
            if (!isNaN(rawVal)) {
                let parts = rawVal.split('.');
                parts[0] = Number(parts[0]).toLocaleString('en-US');
                input.value = parts.join('.');
            }
        }

        function formatD7OnBlur() {
            const input = document.getElementById('inputD7');
            if (input.value === '' || input.value === '-') {
                input.value = '-';
            }
        }

        function getNumericD7() {
            const val = document.getElementById('inputD7').value;
            if (val === '-' || val === '') return 0;
            return parseFloat(val.replace(/,/g, '')) || 0;
        }

        async function initApp() {
            showLoader();
            try {
                const res = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
                const json = await res.json();
                
                let rawList = [];
                if (Array.isArray(json)) {
                    rawList = json;
                } else if (json && Array.isArray(json.data)) {
                    rawList = json.data;
                } else if (json && json.data && typeof json.data === 'object') {
                    Object.keys(json.data).forEach(k => {
                        if (Array.isArray(json.data[k])) {
                            rawList = rawList.concat(json.data[k]);
                        }
                    });
                } else if (json && json.plans && Array.isArray(json.plans)) {
                    rawList = json.plans;
                }

                insuranceList = rawList;
                populateDropdowns();
            } catch (e) {
                console.error("API Error:", e);
            } finally {
                hideLoader();
            }
        }

        function populateDropdowns() {
            const mainSelect = document.getElementById('selectMainPlan');
            mainSelect.innerHTML = '<option value="">เลือกแบบประกัน</option>';
            
            const uniqueMainPlans = new Map();
            const uniqueRiders = new Map();

            insuranceList.forEach(item => {
                const planId = getValue(item, ['Plan_ID', 'plan_id', 'PlanID', 'Plan ID', 'id']);
                const planName = getValue(item, ['Plan_Name', 'plan_name', 'PlanName', 'Plan Name', 'name']);
                
                if (planId && planName) {
                    if (planId.toUpperCase().startsWith('P')) {
                        if (!uniqueMainPlans.has(planId)) uniqueMainPlans.set(planId, planName);
                    } else {
                        if (!uniqueRiders.has(planId)) uniqueRiders.set(planId, planName);
                    }
                }
            });

            uniqueMainPlans.forEach((planName, planId) => {
                const opt = document.createElement('option');
                opt.value = planId;
                opt.textContent = planName;
                mainSelect.appendChild(opt);
            });

            const riderSelects = document.querySelectorAll('.rider-select');
            riderSelects.forEach((select) => {
                select.innerHTML = '<option value="">เลือกสัญญาเพิ่มเติม</option>';
                uniqueRiders.forEach((rName, rId) => {
                    const opt = document.createElement('option');
                    opt.value = rId;
                    opt.textContent = rName;
                    select.appendChild(opt);
                });
            });
        }

        function triggerCalculateD6() {
            clearTimeout(debounceTimerD6);
            debounceTimerD6 = setTimeout(() => {
                calculateD6();
            }, 300);
        }

        function triggerCalculateRiders() {
            clearTimeout(debounceTimerRiders);
            debounceTimerRiders = setTimeout(() => {
                calculateRiders();
            }, 300);
        }

        function triggerCalculateAll() {
            triggerCalculateD6();
            triggerCalculateRiders();
        }

        // 1. คำนวณสัญญาหลัก (D6) พร้อมหักส่วนลด Per_Unit จากช่วงทุนประกัน
        async function calculateD6() {
            const gender = document.getElementById('inputD4').value;
            const age = document.getElementById('inputD2').value;
            const occClass = document.getElementById('inputD3').value;
            const mainPlanId = document.getElementById('selectMainPlan').value;
            const mainSum = getNumericD7();
            const inputD6 = document.getElementById('inputD6');

            if (gender === '-' || age === '-' || occClass === '-' || !mainPlanId || mainSum <= 0) {
                inputD6.value = "-";
                inputD6.classList.remove('calculating-text');
                updateTotalD17();
                return;
            }

            inputD6.value = "กำลังคำนวน";
            inputD6.classList.add('calculating-text');

            try {
                // ส่งค่า sum ไปด้วย เพื่อให้ backend ตรวจสอบช่วง Min_Sum / Max_Sum ในชีท Discounts
                const rateUrl = `${API_URL}?action=getRate&planId=${mainPlanId}&gender=${gender}&age=${age}&occupationClass=${occClass}&sum=${mainSum}`;
                const rateRes = await fetch(rateUrl, { redirect: 'follow' }).then(r => r.json());
                
                const rData = rateRes.data || rateRes.Data;
                if (rateRes.status === 'success' && rData && rData.Factor_Rate !== undefined) {
                    let factorRate = parseFloat(rData.Factor_Rate) || 0;
                    let discountRate = parseFloat(rData.Discount_Rate) || 0;
                    let discountType = String(rData.Discount_Type || '').trim().toLowerCase();

                    // หากเป็นประเภท Per_Unit ให้หัก Discount_Rate ออกจาก Factor_Rate
                    let netFactorRate = factorRate;
                    if (discountType === 'per_unit') {
                        netFactorRate = Math.max(0, factorRate - discountRate);
                    }

                    // คำนวณเบี้ยประกันสุทธิ
                    const mainPrem = (netFactorRate * mainSum) / (rData.Base_Factor || 1000);
                    inputD6.value = Math.round(mainPrem).toLocaleString('en-US');
                    inputD6.classList.remove('calculating-text');
                } else {
                    inputD6.value = "-";
                    inputD6.classList.remove('calculating-text');
                }
            } catch(e) {
                console.error(e);
                inputD6.value = "-";
                inputD6.classList.remove('calculating-text');
            }

            updateTotalD17();
        }

        // 2. คำนวณสัญญาเพิ่มเติมทั้งหมด (แยกอิสระ)
        async function calculateRiders() {
            const gender = document.getElementById('inputD4').value;
            const age = document.getElementById('inputD2').value;
            const occClass = document.getElementById('inputD3').value;
            
            const riderRows = document.querySelectorAll('.rider-row');
            const promises = [];

            riderRows.forEach(row => {
                const rSelect = row.querySelector('.rider-select');
                const rPremInput = row.querySelector('.rider-premium');
                const rId = rSelect.value;

                if (gender === '-' || age === '-' || occClass === '-' || !rId) {
                    rPremInput.value = "-";
                    rPremInput.classList.remove('calculating-text');
                    return;
                }

                rPremInput.value = "กำลังคำนวน";
                rPremInput.classList.add('calculating-text');

                promises.push((async () => {
                    try {
                        const rUrl = `${API_URL}?action=getRate&planId=${rId}&gender=${gender}&age=${age}&occupationClass=${occClass}`;
                        const rRes = await fetch(rUrl, { redirect: 'follow' }).then(r => r.json());
                        
                        const rData = rRes.data || rRes.Data;
                        if (rRes.status === 'success' && rData && rData.Factor_Rate !== undefined) {
                            const riderPrem = parseFloat(rData.Factor_Rate) || 0;
                            rPremInput.value = Math.round(riderPrem).toLocaleString('en-US');
                            rPremInput.classList.remove('calculating-text');
                        } else {
                            rPremInput.value = "-";
                            rPremInput.classList.remove('calculating-text');
                        }
                    } catch(e) {
                        console.error(e);
                        rPremInput.value = "-";
                        rPremInput.classList.remove('calculating-text');
                    }
                })());
            });

            await Promise.all(promises);
            updateTotalD17();
        }

        // 3. รวมยอดเบี้ยประกันรวม D17
        function updateTotalD17() {
            const totalD17 = document.getElementById('totalD17');
            let total = 0;
            let hasValue = false;

            const d6Val = document.getElementById('inputD6').value;
            if (d6Val !== '-' && d6Val !== 'กำลังคำนวน' && d6Val !== '') {
                total += parseFloat(d6Val.replace(/,/g, '')) || 0;
                hasValue = true;
            }

            document.querySelectorAll('.rider-premium').forEach(el => {
                const val = el.value;
                if (val !== '-' && val !== 'กำลังคำนวน' && val !== '') {
                    total += parseFloat(val.replace(/,/g, '')) || 0;
                    hasValue = true;
                }
            });

            if (hasValue && total > 0) {
                totalD17.textContent = Math.round(total).toLocaleString('en-US');
                totalD17.classList.remove('calculating-text');
            } else {
                totalD17.textContent = "-";
                totalD17.classList.remove('calculating-text');
            }
        }

        function addRiderRow() {
            const container = document.getElementById('ridersList');
            const div = document.createElement('div');
            div.className = 'rider-row';
            
            const uniqueRiders = new Map();
            insuranceList.forEach(item => {
                const rId = getValue(item, ['Plan_ID', 'plan_id', 'PlanID', 'Plan ID', 'id']);
                const rName = getValue(item, ['Plan_Name', 'plan_name', 'PlanName', 'Plan Name', 'name']);
                if (rId && rName && !rId.toUpperCase().startsWith('P')) {
                    if (!uniqueRiders.has(rId)) uniqueRiders.set(rId, rName);
                }
            });

            let optionsHtml = '<option value="">เลือกสัญญาเพิ่มเติม</option>';
            uniqueRiders.forEach((rName, rId) => {
                optionsHtml += `<option value="${rId}">${rName}</option>`;
            });

            div.innerHTML = `
                <select class="input-gray rider-select" onchange="triggerCalculateRiders()">
                    ${optionsHtml}
                </select>
                <input type="text" class="input-gray rider-premium" value="-" placeholder="-" readonly>
            `;

            container.appendChild(div);
        }

        function createPaymentSchedule() {
            alert("สร้างตารางชำระเบี้ยประกันเรียบร้อยแล้ว (Create Payment Schedule)");
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
